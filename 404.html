<!DOCTYPE html>
<html lang="en-IN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Page Not Found | SPL Studios
    </title>

    <meta
        name="description"
        content="The page you are looking for could not be found. Visit SPL Studios for interior design services in Varanasi."
    >

    <!-- 404 pages should not appear in search results -->
    <meta
        name="robots"
        content="noindex, follow"
    >

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <style>

        /* =========================================
           404 PAGE
        ========================================== */

        .error-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 20px;

            background: var(--bg);

            text-align: center;

        }


        .error-content {

            max-width: 700px;

            width: 100%;

        }


        .error-number {

            margin: 0;

            font-size: clamp(
                90px,
                18vw,
                190px
            );

            line-height: 0.9;

            font-weight: 600;

            letter-spacing: -0.06em;

            color: var(--accent);

        }


        .error-content h1 {

            margin: 28px 0 14px;

            font-size: clamp(
                30px,
                5vw,
                52px
            );

            line-height: 1.1;

        }


        .error-content p {

            max-width: 560px;

            margin: 0 auto 30px;

            color: var(--muted);

            font-size: 16px;

            line-height: 1.8;

        }


        .error-actions {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 14px;

            flex-wrap: wrap;

        }


        .error-actions a {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 48px;

            padding: 0 24px;

            border: 1px solid var(--text);

            text-decoration: none;

            font-weight: 600;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;

        }


        .error-actions .primary {

            background: var(--text);

            color: var(--text-light);

        }


        .error-actions .secondary {

            color: var(--text);

            background: transparent;

        }


        .error-actions a:hover {

            opacity: 0.85;

            transform: translateY(-2px);

        }


        .error-brand {

            margin-top: 55px;

            font-size: 13px;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            color: var(--muted);

        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .error-page {

                padding: 30px 20px;

            }


            .error-content p {

                font-size: 15px;

                line-height: 1.7;

            }


            .error-actions {

                flex-direction: column;

                width: 100%;

            }


            .error-actions a {

                width: 100%;

                max-width: 280px;

            }


            .error-brand {

                margin-top: 40px;

                font-size: 11px;

            }

        }

    </style>

</head>


<body>


    <main class="error-page">

        <div class="error-content">


            <p
                class="error-number"
                aria-hidden="true"
            >
                404
            </p>


            <h1>
                Page Not Found
            </h1>


            <p>
                The page you're looking for may have been moved,
                renamed, or is no longer available. You can return
                to SPL Studios and continue exploring our interior
                design work.
            </p>


            <div class="error-actions">


                <a
                    class="primary"
                    href="./"
                >
                    Back to Home
                </a>


                <a
                    class="secondary"
                    href="contact/"
                >
                    Book Consultation
                </a>


            </div>


            <div class="error-brand">

                SPL Studios · Interior Design in Varanasi

            </div>


        </div>

    </main>


    <script src="assets/js/script.js"></script>


</body>

</html>
